spring.application.name=shop
server.port=8201

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5441}/shop
spring.datasource.username=shop
spring.datasource.password=shop
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.graphql.http.path=/graphql
spring.graphql.websocket.path=/graphql-ws
# Production posture: the schema is not advertised to anyone who asks.
spring.graphql.schema.introspection.enabled=false
